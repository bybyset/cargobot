[package]
name = "cargobot"
version = "0.1.0"
authors = ["icff"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "cargobot"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[[bin]]
name = "audio_test"
path = "src/audio_test.rs"
harness = false

[[bin]]
name = "audio_test_basic"
path = "src/audio_test_basic.rs"
harness = false

[[bin]]
name = "oled_test"
path = "src/oled_test.rs"
harness = false

[[bin]]
name = "mic_test"
path = "src/mic_test.rs"
harness = false

[[bin]]
name = "wake_word"
path = "src/wake_word.rs"
harness = false

[profile.release]
debug = false
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[patch.crates-io]
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf-sys.git" }
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf-hal.git" }
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf-svc.git" }
rustpotter = { git = "https://github.com/bybyset/rustpotter.git" , branch = "main" }

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.52.1", features = ["alloc", "critical-section", "embassy-time-driver", "embassy-sync"] }
# Remove `generic-queue-8` if you plan to use `embassy-time` WITH `embassy-executor`
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
heapless = "0.9.2"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
rustpotter = "*"
embedded-websocket = { git = "https://github.com/ninjasource/embedded-websocket", branch = "master", default-features = false }
url = { version = "2" }


[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }
